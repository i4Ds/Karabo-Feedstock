package:
  name: {{ PACKAGE_NAME|lower }}
  version: {{ SKA_SDP_FUNC_VERSION_ALT }}

source:
  git_url: https://gitlab.com/ska-telescope/sdp/ska-sdp-func.git
  git_tag: {{ SKA_SDP_FUNC_VERSION }}

build:
  number: {{ build }}
  string: py{{ py }}h{{ PKG_HASH }}_{{ build }}
  
requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}  # CMake's find_package(CUDA) compiles the GPU kernels when nvcc is present
    - {{ stdlib('c') }}
    - cuda-cuobjdump  # build.sh checks which GPU architectures ended up in the library
    - cmake
    - make
    - python
    - numpy

  host:
    - python  {{ python }}
    - pip
    - numpy
    # CUDA kernels (find_package(CUDA) in CMakeLists.txt); cudart/cufft come back as run_exports
    - cuda-version {{ cuda_compiler_version }}
    - cuda-cudart-dev
    - libcufft-dev

  run:
    - python  {{ python }}
    - {{ pin_compatible('numpy') }}

about:
  home: https://gitlab.com/ska-telescope/sdp/ska-sdp-func/
  license: BSD
  license_file: LICENSE
  summary: 'SKA SDP Processing Functions'
  description: |
   SKA SDP Functions
  doc_url: https://developer.skao.int/projects/ska-sdp-func/en/latest/
  dev_url: https://gitlab.com/ska-telescope/sdp/ska-sdp-func

extra:
  recipe-maintainers:
    - delberin.ali@fhnw.ch
    
