
name: AOTools

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "main"
        required: true
      dev:
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish to Anaconda (leave disabled for validation)"
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true

  workflow_call:
    secrets:
      ANACONDA_SECRET:
        required: false
    inputs:
      checkoutRef:
        required: false
        default: ""
        type: string
      versionOverride:
        type: string
        required: false
        default: ""
      label:
        type: string
        required: true
      dev:
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish to Anaconda (leave disabled for validation)"
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true

jobs:
  resolve-version:
    name: Resolve AOtools version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkoutRef || github.sha }}

      - name: Read AOtools release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(python3 -c '
          import json
          import re

          with open("aotools/release.json", encoding="utf-8") as f:
              data = json.load(f)

          version = data["version"]

          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid AOtools release version")

          print(version)
          ')

          echo "version=$version" >> "$GITHUB_OUTPUT"

  AOTools:
    name: Build AOtools
    needs: resolve-version

    uses: ./.github/workflows/build_base.yml

    with:
      packageName: aotools
      checkoutRef: ${{ inputs.checkoutRef }}
      packageVersion: $AOTOOLS_VERSION
      packageVersionName: AOTOOLS_VERSION
      label: ${{ inputs.label }}
      dev: ${{ inputs.dev }}
      buildNumber: ${{ inputs.buildNumber }}
      versionOverride: ${{ inputs.versionOverride || needs.resolve-version.outputs.version }}
      pythonCall: import aotools
      publish: ${{ inputs.publish }}
      isNative: true

    secrets:
      ANACONDA_SECRET: ${{ inputs.publish && secrets.ANACONDA_SECRET || '' }}
