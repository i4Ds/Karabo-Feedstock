name: AOTools

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "main"
        required: true
      dev:
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish to Anaconda (leave disabled for validation)"
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true

  workflow_call:
    secrets:
      ANACONDA_SECRET:
        required: false
    inputs:
      checkoutRef:
        required: false
        default: ""
        type: string
      versionOverride:
        type: string
        required: false
        default: ""
      label:
        type: string
        required: true
      dev:
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish to Anaconda (leave disabled for validation)"
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true

jobs:

  AOTools:
    uses: ./.github/workflows/build_base.yml
    with:
      packageName: aotools
      checkoutRef: ${{ inputs.checkoutRef }}
      packageVersion: $AOTOOLS_VERSION
      packageVersionName: AOTOOLS_VERSION
      label: ${{ inputs.label }}
      dev: ${{ inputs.dev }}
      buildNumber: ${{ inputs.buildNumber }}
      versionOverride: ${{ inputs.versionOverride }}
      pythonCall: import aotools
      publish: ${{ inputs.publish }}
      isNative: true
    secrets:
      ANACONDA_SECRET: ${{ inputs.publish && secrets.ANACONDA_SECRET || '' }}
