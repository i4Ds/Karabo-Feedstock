name: Oskar Python Wrapper

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "main"
        required: true
      dev:
        type: boolean
        required: false
        default: false
      devDeps:
        type: string
        required: false
        default: "OSKAR_VERSION"
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: true
      checkoutRef:
        type: string
        required: false
        default: ""
      versionOverride:
        type: string
        required: false
        default: ""
      dependencyArtifact:
        type: string
        required: false
        default: ""
        
  workflow_call:
    inputs:
      label:
        type: string
        required: true
      dev:
        type: boolean
        required: false
        default: false
      devDeps:
        type: string
        required: false
        default: "OSKAR_VERSION"
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: true
      checkoutRef:
        type: string
        required: false
        default: ""
      versionOverride:
        type: string
        required: false
        default: ""
      dependencyArtifact:
        type: string
        required: false
        default: ""

jobs:

  OskarPy:
    uses: ./.github/workflows/build_base.yml
    with:
      packageName: oskarpy
      packageVersion: $OSKARPY_VERSION
      packageVersionName: OSKARPY_VERSION
      label: ${{ inputs.label }}
      dev: ${{ inputs.dev }}
      buildNumber: ${{ inputs.buildNumber }}
      publish: ${{ inputs.publish }}
      checkoutRef: ${{ inputs.checkoutRef }}
      versionOverride: ${{ inputs.versionOverride }}
      dependencyArtifact: ${{ inputs.dependencyArtifact }}
      devDeps: ${{ inputs.devDeps }}
      pythonCall: import oskar
      customPath: oskar-py/.
      isNative: true
      buildArm: true
    secrets: inherit
