name: ARatmospy

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "main"
        required: true
      dev:
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      label:
        type: string
        required: true
      dev:
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: false

jobs:

  Aratmospy:
    uses: ./.github/workflows/build_base.yml
    with:
      packageName: aratmospy
      packageVersion: $ARATMOSPY_VERSION
      packageVersionName: ARATMOSPY_VERSION
      label: ${{ inputs.label }}
      dev: ${{ inputs.dev }}
      buildNumber: ${{ inputs.buildNumber }}
      pythonCall: import ARatmospy  # the module is capitalised; the distribution is aratmospy
      isNative: false
      publish: ${{ inputs.publish }}
    secrets: inherit
