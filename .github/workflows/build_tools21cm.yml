name: Tools21cm

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "main"
        required: true
      dev:
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: true

  workflow_call:
    secrets:
      ANACONDA_SECRET:
        required: false
    inputs:
      label:
        type: string
        required: true
      dev:
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: true

jobs:

  tools21cm:
    uses: ./.github/workflows/build_base.yml
    with:
      packageName: tools21cm
      packageVersion: $TOOLS_21CM_VERSION
      packageVersionName: TOOLS_21CM_VERSION
      label: ${{ inputs.label }}
      dev: ${{ inputs.dev }}
      buildNumber: ${{ inputs.buildNumber }}
      pythonCall: import tools21cm
      isNative: true
      buildArm: true
      publish: ${{ inputs.publish }}
    secrets: inherit