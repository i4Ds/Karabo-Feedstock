name: Build Base

env:
  # Native Global Libs
  FFTW3_VERSION: 3.3.10
  FFTW3F_VERSION: 3.3.10

  # Rascil Line
  PYBDSF_VERSION: 1.13.0.post2 #1.10.2
  RASCIL_VERSION: 2.1.0 #1.0.0
  SKA_SDP_DTMDL_VERSION: 1.0.0 #0.1.3
  SKA_SDP_FUNC_PY_VERSION: 1.0.0  #0.1.4
  SKA_SDP_FUNC_VERSION: 1.0.0 #0.0.6

  # Oskar Line
  OSKAR_VERSION: 2.12.2
  OSKARPY_VERSION: 2.12.2  # oskarpy should have same version as `OSKAR_VERSION`

  # casacore possible combinations from https://anaconda.org/conda-forge/casacore/files
  # | casacore | build     | boost   | hdf5    | numpy    | cfitsio |
  # |    3.7.1 |           |   =1.86 | =1.14.6 |   >=1.19 |  =4.6.2 |
  # |    3.7.0 | _0        |   =1.86 | =1.14.3 |   >=1.19 |  =4.5.0 |
  # |    3.6.1 | _4        |   =1.86 | =1.14.4 |   >=1.19 |  =4.5.0 |
  # |    3.6.1 | _0        |   =1.86 | =1.14.3 |   >=1.19 |  =4.4.1 |
  # |    3.5.0 | _0        | =1.74.1 | =1.12.1 | >=1.21.6 |  =4.0.0 |
  # |    3.5.0 | nompi_117 |   =1.84 | =1.14.3 | >=1.22.4 |  =4.4.0 |
  # |    3.5.0 | nompi_115 |   =1.82 | =1.14.3 | >=1.22.4 |  =4.4.0 |
  # |    3.5.0 | nompi_114 |   =1.82 | =1.14.2 | >=1.22.4 |  =4.3.1 | *this one!
  # |    3.5.0 | nompi_110 |   =1.78 | =1.14.1 | >=1.21.6 |  =4.3.0 |
  CASACORE_VERSION: 3.7.1
  BOOST_VERSION:    1.88.0
  HDF5_VERSION:     1.14.6
  CFITSIO_VERSION:  4.6.2

  # hvox Line -> don't add dev-label through ci-options because the setup is not ready for that.
  HVOX_VERSION: 0.0.1.dev48  # `pbr` version because they don't have an official release tag yet
  PYCSOU_VERSION: 1.0.7.dev1679  # `pbr` version because they just refer to `v2-dev` branch which has this version

  # WSClean
  IDG_VERSION: 1.2.0
  EVERYBEAM_VERSION: 0.8.0
  WSCLEAN_VERSION: 3.6.0


  # additional karabo dependencies
  AOTOOLS_VERSION: 1.0.7
  SEQFILE_VERSION: 0.2.0
  EIDOS_VERSION: 1.1.0
  SKA_GRDR_NFTY_CU_VERSION: 0.3.0
  KATBEAM_VERSION: 0.1.0 # acutal version 0.1 and has therefore no patch, but is needed for conda-build
  TOOLS_21CM_VERSION: 2.0.3 # actual version 2.0, patch needed for correct scipy version
  ARATMOSPY_VERSION: 1.0.0
  MONTAGEPY_VERSION: 6.0.0 # version is pinned through python-wheel in conda_build_config.yaml

  # SKACH contributions
  FINUFFT_VERSION: 2.2.0
  BLUEBILD_VERSION: 0.1.0

  # Other
  PACKAGE_NAME: ${{ inputs.packageName }}
  CHANNEL_LABEL: ${{ inputs.label }}

on:
  workflow_call:
    inputs:

      packageName:
        required: true
        type: string

      packageVersion:
        required: true
        type: string

      packageVersionName:  # env.VAR_NAME of the corresponding build
        required: true
        type: string

      buildNumber:
        required: true
        type: string

      customPath:
        required: false
        type: string

      pythonCall:
        required: false
        default: ""
        type: string

      label:
        required: false
        default: "main"
        type: string

      dev:
        required: false
        default: false
        type: boolean

      devDeps:  # string of dev-deps with ", " as delimiter
        required: false
        default: ""  # set matching packages-names for dev to use
        type: string

      useCuda:
        required: false
        default: false
        type: boolean

      isNative:
        required: false
        default: false
        type: boolean

      skipTest:
        required: false
        default: false
        type: boolean

jobs:
  build_base:
    name: Build ${{ inputs.packageName }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    outputs:
      pkgv: ${{ steps.pkgv.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Install GCC 11 for CUDA 12
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

      - name: Free disk space on runner
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Install CUDA Toolkit
        if: ${{ inputs.useCuda }}
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "12.0.1"
          log-file-suffix: "build"

      - name: Set custom path to recipe
        if: inputs.customPath != ''
        shell: bash
        run: |
          echo "recipePath=${{ inputs.customPath }}" >> "$GITHUB_ENV"

      - name: Set default path to recipe
        if: inputs.customPath == ''
        shell: bash
        run: |
          echo "recipePath=${{ inputs.packageName }}/." >> "$GITHUB_ENV"

      - name: Prepare setup
        id: pkgv
        shell: bash
        run: |
          set -euo pipefail

          BUILD_NR=${{ inputs.buildNumber }}

          if [[ "${{ inputs.dev }}" == "true" ]]; then
            BUILD_NR=$((BUILD_NR + 1000))
            PKG_VERSION=$(echo "${{ inputs.packageVersion }}" | sed 's/\([0-9]*\.[0-9]*\.\)\([0-9]*\)/\1dev\2/g')
            DEV_DEPS_LIST="${{ inputs.packageVersionName }}, ${{ inputs.devDeps }}"
          else
            PKG_VERSION="${{ inputs.packageVersion }}"
            DEV_DEPS_LIST=""
          fi

          echo "build=$BUILD_NR" >> "$GITHUB_ENV"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          PKG_KEYS=$(echo '${{ toJSON(env) }}' | jq -r 'keys | .[]')

          for PKG_KEY in $PKG_KEYS; do
            if [[ "$DEV_DEPS_LIST" == *"$PKG_KEY"* ]]; then
              VERSION_ALT=$(echo "${!PKG_KEY}" | sed 's/\([0-9]*\.[0-9]*\.\)\([0-9]*\)/\1dev\2/g')
            else
              VERSION_ALT=${!PKG_KEY}
            fi

            NAME_ALT=${PKG_KEY}_ALT
            echo "$NAME_ALT=$VERSION_ALT" >> "$GITHUB_ENV"
          done

      - name: Configure Conda build environment
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda install -y -n base conda-libmamba-solver
          conda config --set solver libmamba
          conda config --remove-key channels || true

          conda config --add channels conda-forge
          conda config --add channels "i4ds/label/${{ inputs.label }}"
          conda config --add channels i4ds
          conda config --add channels defaults
          conda config --set channel_priority flexible

          conda install -y -n base "conda-build>=25"

      - name: Determine package output path
        id: package-output
        shell: bash -l {0}
        run: |
          set -euo pipefail

          PACKAGE_PATH="$(
            conda build \
              --output \
              -c "i4ds/label/${{ inputs.label }}" \
              -c i4ds \
              -c conda-forge \
              "${{ env.recipePath }}" |
            tail -n 1
          )"

          if [[ -z "$PACKAGE_PATH" ]]; then
            echo "Could not determine the Conda package output path."
            exit 1
          fi

          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "Expected package: $PACKAGE_PATH"

      - name: Build Conda package
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda build \
            -c "i4ds/label/${{ inputs.label }}" \
            -c i4ds \
            -c conda-forge \
            "${{ env.recipePath }}"

      - name: Stage built package
        shell: bash -l {0}
        env:
          PACKAGE_PATH: ${{ steps.package-output.outputs.package_path }}
        run: |
          set -euo pipefail

          if [[ ! -f "$PACKAGE_PATH" ]]; then
            echo "Built package was not found:"
            echo "$PACKAGE_PATH"
            exit 1
          fi

          mkdir -p dist
          cp "$PACKAGE_PATH" dist/

          echo "Staged package:"
          ls -lh dist

      - name: Upload built Conda package
        uses: actions/upload-artifact@v4
        with:
          name: conda-package-${{ inputs.packageName }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test_base:
    name: Test ${{ inputs.packageName }} with Python ${{ matrix.python-version }}
    needs: build_base
    if: ${{ !inputs.skipTest }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Configure Mamba solver
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda install -y -n base conda-libmamba-solver
          conda config --set solver libmamba

      - name: Install GCC 11 for CUDA 12
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

      - name: Free disk space on runner
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Install CUDA Toolkit
        if: ${{ inputs.useCuda }}
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "12.0.1"
          log-file-suffix: "test-${{ matrix.python-version }}"

      - name: Download built Conda package
        uses: actions/download-artifact@v4
        with:
          name: conda-package-${{ inputs.packageName }}
          path: dist

      - name: Locate downloaded package
        id: downloaded-package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PACKAGES < <(
            find dist -type f \
              \( -name "*.conda" -o -name "*.tar.bz2" \)
          )

          if [[ "${#PACKAGES[@]}" -eq 0 ]]; then
            echo "No Conda package was found in the artifact."
            exit 1
          fi

          if [[ "${#PACKAGES[@]}" -gt 1 ]]; then
            echo "Expected one package but found:"
            printf '%s\n' "${PACKAGES[@]}"
            exit 1
          fi

          echo "package_path=${PACKAGES[0]}" >> "$GITHUB_OUTPUT"
          echo "Testing package: ${PACKAGES[0]}"

      - name: Install and test package
        shell: bash -l {0}
        env:
          PACKAGE_PATH: ${{ steps.downloaded-package.outputs.package_path }}
        run: |
          set -euo pipefail

          conda create -y \
            -n testenv \
            "python=${{ matrix.python-version }}"

          conda activate testenv

          conda install -y \
            --override-channels \
            -c "i4ds/label/${{ inputs.label }}" \
            -c i4ds \
            -c conda-forge \
            "$PACKAGE_PATH"

          python --version
          python -c "import sys; print(sys.executable)"

          if [[ -n "${{ inputs.pythonCall }}" ]]; then
            python -c "${{ inputs.pythonCall }}"
          fi

      - name: Show installed environment
        if: always()
        shell: bash -l {0}
        run: |
          conda info
          conda list -n testenv || true

  publish:
    name: Publish ${{ inputs.packageName }} to Anaconda
    needs:
      - build_base
      - test_base
    if: ${{ success() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Download tested Conda package
        uses: actions/download-artifact@v4
        with:
          name: conda-package-${{ inputs.packageName }}
          path: dist

      - name: Locate package for publishing
        id: publish-package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PACKAGES < <(
            find dist -type f \
              \( -name "*.conda" -o -name "*.tar.bz2" \)
          )

          if [[ "${#PACKAGES[@]}" -eq 0 ]]; then
            echo "No Conda package was found for publishing."
            exit 1
          fi

          if [[ "${#PACKAGES[@]}" -gt 1 ]]; then
            echo "Expected one package but found:"
            printf '%s\n' "${PACKAGES[@]}"
            exit 1
          fi

          echo "package_path=${PACKAGES[0]}" >> "$GITHUB_OUTPUT"
          echo "Publishing package: ${PACKAGES[0]}"

      - name: Publish package to Anaconda
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_SECRET }}
          PACKAGE_PATH: ${{ steps.publish-package.outputs.package_path }}
        run: |
          set -euo pipefail

          conda install -y -n base anaconda-client

          anaconda \
            --token "$ANACONDA_TOKEN" \
            upload "$PACKAGE_PATH" \
            --label "${{ inputs.label }}"
