name: Build Base

env:
  # Native Global Libs
  FFTW3_VERSION: 3.3.10
  FFTW3F_VERSION: 3.3.10

  # Rascil Line
  PYBDSF_VERSION: 1.13.0.post2
  RASCIL_VERSION: 2.1.0
  SKA_SDP_DTMDL_VERSION: 1.0.0
  SKA_SDP_FUNC_PY_VERSION: 1.0.0
  SKA_SDP_FUNC_VERSION: 1.0.0

  # Oskar Line
  OSKAR_VERSION: 2.12.2
  OSKARPY_VERSION: 2.12.2

  # Casacore
  CASACORE_VERSION: 3.7.1
  BOOST_VERSION: 1.88.0
  HDF5_VERSION: 1.14.6
  CFITSIO_VERSION: 4.6.2

  # hvox Line
  HVOX_VERSION: 0.0.1.dev48
  PYCSOU_VERSION: 1.0.7.dev1679

  # WSClean
  IDG_VERSION: 1.2.0
  EVERYBEAM_VERSION: 0.8.0
  WSCLEAN_VERSION: 3.6.0

  # Additional Karabo dependencies
  AOTOOLS_VERSION: 1.0.7
  SEQFILE_VERSION: 0.2.0
  EIDOS_VERSION: 1.1.0
  SKA_GRDR_NFTY_CU_VERSION: 0.3.0
  KATBEAM_VERSION: 0.1.0
  TOOLS_21CM_VERSION: 2.0.3
  ARATMOSPY_VERSION: 1.0.0
  MONTAGEPY_VERSION: 6.0.0

  # SKACH contributions
  FINUFFT_VERSION: 2.2.0
  BLUEBILD_VERSION: 0.1.0

  # Other
  PACKAGE_NAME: ${{ inputs.packageName }}
  CHANNEL_LABEL: ${{ inputs.label }}

on:
  workflow_call:
    inputs:
      pythonVersions:
        description: "Comma-separated Python versions"
        required: false
        default: "3.12"
        type: string

      packageName:
        required: true
        type: string

      packageVersion:
        required: true
        type: string

      packageVersionName:
        required: true
        type: string

      buildNumber:
        required: true
        type: string

      customPath:
        required: false
        default: ""
        type: string

      pythonCall:
        required: false
        default: ""
        type: string

      label:
        required: false
        default: main
        type: string

      dev:
        required: false
        default: false
        type: boolean

      devDeps:
        required: false
        default: ""
        type: string

      useCuda:
        required: false
        default: false
        type: boolean

      isNative:
        required: false
        default: false
        type: boolean

      skipTest:
        required: false
        default: false
        type: boolean

jobs:
  prepare_matrix:
    name: Prepare Python matrix
    runs-on: ubuntu-22.04

    outputs:
      python_versions: ${{ steps.matrix.outputs.python_versions }}

    steps:
      - name: Convert Python versions to JSON
        id: matrix
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ inputs.pythonVersions }}
        run: |
          set -euo pipefail

          IFS=',' read -ra RAW_VERSIONS <<< "$PYTHON_VERSIONS"

          declare -a VERSIONS=()
          declare -A SEEN=()

          for RAW_VERSION in "${RAW_VERSIONS[@]}"; do
            VERSION="$(echo "$RAW_VERSION" | xargs)"

            if [[ -z "$VERSION" ]]; then
              continue
            fi

            if [[ ! "$VERSION" =~ ^3\.[0-9]+$ ]]; then
              echo "Invalid Python version: '$VERSION'"
              echo "Use comma-separated versions such as: 3.12 or 3.11,3.12"
              exit 1
            fi

            if [[ -z "${SEEN[$VERSION]+x}" ]]; then
              VERSIONS+=("$VERSION")
              SEEN["$VERSION"]=1
            fi
          done

          if [[ "${#VERSIONS[@]}" -eq 0 ]]; then
            echo "No Python versions were provided."
            exit 1
          fi

          PYTHON_VERSIONS_JSON="$(
            printf '%s\n' "${VERSIONS[@]}" |
              jq -R . |
              jq -sc .
          )"

          echo "python_versions=$PYTHON_VERSIONS_JSON" >> "$GITHUB_OUTPUT"
          echo "Selected Python versions: $PYTHON_VERSIONS_JSON"

  build_base:
    name: Build ${{ inputs.packageName }} with Python ${{ matrix.python-version }}
    needs: prepare_matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.prepare_matrix.outputs.python_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Install GCC 11 for CUDA 12
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

      - name: Free disk space on runner
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Install CUDA Toolkit
        if: ${{ inputs.useCuda }}
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "12.0.1"
          log-file-suffix: build

      - name: Set custom recipe path
        if: ${{ inputs.customPath != '' }}
        shell: bash
        run: |
          echo "recipePath=${{ inputs.customPath }}" >> "$GITHUB_ENV"

      - name: Set default recipe path
        if: ${{ inputs.customPath == '' }}
        shell: bash
        run: |
          echo "recipePath=${{ inputs.packageName }}/." >> "$GITHUB_ENV"

      - name: Prepare package variables
        id: pkgv
        shell: bash
        run: |
          set -euo pipefail

          BUILD_NR="${{ inputs.buildNumber }}"

          if [[ "${{ inputs.dev }}" == "true" ]]; then
            BUILD_NR=$((BUILD_NR + 1000))
            PKG_VERSION="$(echo "${{ inputs.packageVersion }}" |
              sed 's/\([0-9]*\.[0-9]*\.\)\([0-9]*\)/\1dev\2/g')"
            DEV_DEPS_LIST="${{ inputs.packageVersionName }}, ${{ inputs.devDeps }}"
          else
            PKG_VERSION="${{ inputs.packageVersion }}"
            DEV_DEPS_LIST=""
          fi

          echo "build=$BUILD_NR" >> "$GITHUB_ENV"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          PKG_KEYS="$(echo '${{ toJSON(env) }}' | jq -r 'keys[]')"

          for PKG_KEY in $PKG_KEYS; do
            if [[ "$DEV_DEPS_LIST" == *"$PKG_KEY"* ]]; then
              VERSION_ALT="$(echo "${!PKG_KEY}" |
                sed 's/\([0-9]*\.[0-9]*\.\)\([0-9]*\)/\1dev\2/g')"
            else
              VERSION_ALT="${!PKG_KEY}"
            fi

            echo "${PKG_KEY}_ALT=$VERSION_ALT" >> "$GITHUB_ENV"
          done

      - name: Configure Conda build environment
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda install -y -n base conda-libmamba-solver
          conda config --set solver libmamba
          conda config --remove-key channels || true

          conda config --add channels conda-forge
          conda config --add channels "i4ds/label/${{ inputs.label }}"
          conda config --add channels i4ds
          conda config --add channels defaults
          conda config --set channel_priority flexible

          conda install -y -n base "conda-build>=25"

      - name: Determine package output paths
        shell: bash -l {0}
        run: |
          set -euo pipefail

          mkdir -p package-paths

          mapfile -t PACKAGE_PATHS < <(
            conda build \
              --output \
              --python "${{ matrix.python-version }}" \
              -c "i4ds/label/${{ inputs.label }}" \
              -c i4ds \
              -c conda-forge \
              "${{ env.recipePath }}" |
            grep -E '\.(conda|tar\.bz2)$'
          )

          if [[ "${#PACKAGE_PATHS[@]}" -eq 0 ]]; then
            echo "No Conda package outputs were detected."
            exit 1
          fi

          printf '%s\n' "${PACKAGE_PATHS[@]}" |
            sort -u > package-paths/packages.txt

          echo "Detected package outputs:"
          sed 's/^/ - /' package-paths/packages.txt

      - name: Build Conda packages
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda build \
            --python "${{ matrix.python-version }}" \
            -c "i4ds/label/${{ inputs.label }}" \
            -c i4ds \
            -c conda-forge \
            "${{ env.recipePath }}"

      - name: Stage built Conda packages
        shell: bash -l {0}
        run: |
          set -euo pipefail

          # Preserve the standard Conda channel layout. This allows the same
          # artifact bundle to support both platform-specific and noarch outputs.
          mkdir -p dist/linux-64 dist/noarch

          while IFS= read -r PACKAGE_PATH; do
            [[ -n "$PACKAGE_PATH" ]] || continue

            if [[ ! -f "$PACKAGE_PATH" ]]; then
              echo "Expected package was not found:"
              echo "$PACKAGE_PATH"
              exit 1
            fi

            SUBDIR="$(basename "$(dirname "$PACKAGE_PATH")")"

            case "$SUBDIR" in
              linux-64|noarch)
                ;;
              *)
                echo "Unsupported Conda output subdirectory: $SUBDIR"
                echo "Package: $PACKAGE_PATH"
                exit 1
                ;;
            esac

            cp "$PACKAGE_PATH" "dist/$SUBDIR/"
          done < package-paths/packages.txt

          mapfile -t STAGED_PACKAGES < <(
            find dist -type f \
              \( -name "*.conda" -o -name "*.tar.bz2" \) |
            sort
          )

          if [[ "${#STAGED_PACKAGES[@]}" -eq 0 ]]; then
            echo "No Conda packages were staged."
            exit 1
          fi

          echo "Staged packages:"
          printf ' - %s\n' "${STAGED_PACKAGES[@]}"

      - name: Upload built Conda packages
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ inputs.packageName }}-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test_base:
    name: Test ${{ inputs.packageName }} with Python ${{ matrix.python-version }}
    needs:
      - prepare_matrix
      - build_base
    if: ${{ !inputs.skipTest }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.prepare_matrix.outputs.python_versions) }}

    steps:
      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Configure Conda test environment
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda install -y -n base conda-libmamba-solver
          conda config --set solver libmamba
          conda config --remove-key channels || true

          conda config --add channels conda-forge
          conda config --add channels "i4ds/label/${{ inputs.label }}"
          conda config --add channels i4ds
          conda config --add channels defaults
          conda config --set channel_priority flexible

      - name: Install GCC 11 for CUDA 12
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

      - name: Free disk space on runner
        if: ${{ inputs.useCuda }}
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Install CUDA Toolkit
        if: ${{ inputs.useCuda }}
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "12.0.1"
          log-file-suffix: test-${{ matrix.python-version }}

      - name: Download built Conda packages
        uses: actions/download-artifact@v4
        with:
          name: conda-packages-${{ inputs.packageName }}-py${{ matrix.python-version }}
          path: dist

      - name: Create temporary local Conda channel
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda install -y -n base "conda-build>=25"

          # actions/download-artifact preserves the uploaded subdirectories.
          # Ensure both standard subdirectories exist before indexing.
          mkdir -p dist/linux-64 dist/noarch
          conda index dist

          echo "Temporary local Conda channel contents:"
          find dist -maxdepth 2 -type f | sort

      - name: Locate matching Conda package
        id: downloaded-package
        shell: bash
        run: |
          set -euo pipefail

          PYTHON_TAG="${{ matrix.python-version }}"
          PYTHON_TAG="${PYTHON_TAG/.}"

          mapfile -t ALL_PACKAGES < <(
            find dist -type f \
              \( -name "*.conda" -o -name "*.tar.bz2" \) |
            sort
          )

          if [[ "${#ALL_PACKAGES[@]}" -eq 0 ]]; then
            echo "No Conda packages were found in the artifact."
            exit 1
          fi

          mapfile -t VERSIONED_PACKAGES < <(
            printf '%s\n' "${ALL_PACKAGES[@]}" |
            grep -E -- "-py${PYTHON_TAG}[^/]*\.(conda|tar\.bz2)$" || true
          )

          if [[ "${#VERSIONED_PACKAGES[@]}" -eq 1 ]]; then
            PACKAGE_PATH="${VERSIONED_PACKAGES[0]}"
          elif [[ "${#VERSIONED_PACKAGES[@]}" -gt 1 ]]; then
            echo "Multiple packages match Python ${{ matrix.python-version }}:"
            printf ' - %s\n' "${VERSIONED_PACKAGES[@]}"
            exit 1
          else
            mapfile -t NOARCH_PACKAGES < <(
              printf '%s\n' "${ALL_PACKAGES[@]}" |
              grep -E -- "-pyh[^/]*\.(conda|tar\.bz2)$" || true
            )

            if [[ "${#NOARCH_PACKAGES[@]}" -eq 1 ]]; then
              PACKAGE_PATH="${NOARCH_PACKAGES[0]}"
            elif [[ "${#ALL_PACKAGES[@]}" -eq 1 ]] &&
                 [[ "$(basename "${ALL_PACKAGES[0]}")" != *-py3[0-9][0-9]* ]]; then
              PACKAGE_PATH="${ALL_PACKAGES[0]}"
            else
              echo "No unique package matched Python ${{ matrix.python-version }}."
              echo "Available packages:"
              printf ' - %s\n' "${ALL_PACKAGES[@]}"
              exit 1
            fi
          fi

          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "Testing package: $PACKAGE_PATH"

      - name: Validate selected package
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.downloaded-package.outputs.package_path }}
        run: |
          set -euo pipefail

          PYTHON_TAG="${{ matrix.python-version }}"
          PYTHON_TAG="${PYTHON_TAG/.}"
          PACKAGE_FILE="$(basename "$PACKAGE_PATH")"

          if [[ "$PACKAGE_FILE" == *"-pyh"* ]]; then
            echo "Selected noarch Python package: $PACKAGE_FILE"
          elif [[ "$PACKAGE_FILE" == *"-py${PYTHON_TAG}"* ]]; then
            echo "Selected matching Python package: $PACKAGE_FILE"
          elif [[ "$PACKAGE_FILE" != *-py3[0-9][0-9]* ]]; then
            echo "Selected non-Python-specific package: $PACKAGE_FILE"
          else
            echo "Package does not match Python ${{ matrix.python-version }}:"
            echo "$PACKAGE_FILE"
            exit 1
          fi

      - name: Create exact package specification
        id: package-metadata
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.downloaded-package.outputs.package_path }}
          PACKAGE_NAME: ${{ inputs.packageName }}
        run: |
          set -euo pipefail

          PACKAGE_FILE="$(basename "$PACKAGE_PATH")"
          PACKAGE_SUBDIR="$(basename "$(dirname "$PACKAGE_PATH")")"

          case "$PACKAGE_FILE" in
            *.conda)
              PACKAGE_FILENAME="${PACKAGE_FILE%.conda}"
              ;;
            *.tar.bz2)
              PACKAGE_FILENAME="${PACKAGE_FILE%.tar.bz2}"
              ;;
            *)
              echo "Unsupported Conda package format: $PACKAGE_FILE"
              exit 1
              ;;
          esac

          # packageName is already a required workflow input. Remove that
          # known prefix, then split the remainder from the right:
          #   <version>-<build>
          PACKAGE_PREFIX="${PACKAGE_NAME}-"

          if [[ "$PACKAGE_FILENAME" != "$PACKAGE_PREFIX"* ]]; then
            echo "Selected package does not match packageName '$PACKAGE_NAME':"
            echo "$PACKAGE_FILE"
            exit 1
          fi

          VERSION_AND_BUILD="${PACKAGE_FILENAME#"$PACKAGE_PREFIX"}"

          if [[ "$VERSION_AND_BUILD" != *-* ]]; then
            echo "Could not determine version and build from:"
            echo "$PACKAGE_FILE"
            exit 1
          fi

          PACKAGE_BUILD="${VERSION_AND_BUILD##*-}"
          PACKAGE_VERSION="${VERSION_AND_BUILD%-*}"

          if [[ -z "$PACKAGE_VERSION" || -z "$PACKAGE_BUILD" ]]; then
            echo "Invalid Conda package filename: $PACKAGE_FILE"
            exit 1
          fi

          PACKAGE_SPEC="${PACKAGE_NAME}=${PACKAGE_VERSION}=${PACKAGE_BUILD}"

          {
            echo "name=$PACKAGE_NAME"
            echo "version=$PACKAGE_VERSION"
            echo "build=$PACKAGE_BUILD"
            echo "subdir=$PACKAGE_SUBDIR"
            echo "spec=$PACKAGE_SPEC"
          } >> "$GITHUB_OUTPUT"

          echo "Selected package:"
          echo "  File:    $PACKAGE_FILE"
          echo "  Name:    $PACKAGE_NAME"
          echo "  Version: $PACKAGE_VERSION"
          echo "  Build:   $PACKAGE_BUILD"
          echo "  Subdir:  $PACKAGE_SUBDIR"
          echo "  Spec:    $PACKAGE_SPEC"

      - name: Install and test freshly built package
        shell: bash -l {0}
        env:
          PACKAGE_SPEC: ${{ steps.package-metadata.outputs.spec }}
          PYTHON_CALL: ${{ inputs.pythonCall }}
        run: |
          set -euo pipefail

          LOCAL_CHANNEL="file://${PWD}/dist"

          echo "Installing exact freshly built package:"
          echo "  $PACKAGE_SPEC"
          echo "Local channel:"
          echo "  $LOCAL_CHANNEL"

          # Solve Python, the fresh package and all runtime dependencies in one
          # transaction. The exact name=version=build specification prevents
          # Conda from selecting an older package from a published channel.
          conda create -y \
            -n testenv \
            --override-channels \
            --strict-channel-priority \
            -c "$LOCAL_CHANNEL" \
            -c "i4ds/label/${{ inputs.label }}" \
            -c i4ds \
            -c conda-forge \
            "python=${{ matrix.python-version }}" \
            "$PACKAGE_SPEC"

          conda activate testenv

          python --version
          python -c "import sys; print(sys.executable)"

          if [[ -n "$PYTHON_CALL" ]]; then
            python -c "$PYTHON_CALL"
          fi

      - name: Verify installed package build
        shell: bash -l {0}
        env:
          PACKAGE_NAME: ${{ steps.package-metadata.outputs.name }}
          EXPECTED_VERSION: ${{ steps.package-metadata.outputs.version }}
          EXPECTED_BUILD: ${{ steps.package-metadata.outputs.build }}
        run: |
          set -euo pipefail

          conda activate testenv

          INSTALLED_JSON="$(conda list -n testenv "$PACKAGE_NAME" --json)"
          PACKAGE_COUNT="$(jq 'length' <<< "$INSTALLED_JSON")"

          if [[ "$PACKAGE_COUNT" -ne 1 ]]; then
            echo "Expected exactly one installed package named $PACKAGE_NAME."
            echo "$INSTALLED_JSON"
            exit 1
          fi

          ACTUAL_VERSION="$(jq -r '.[0].version' <<< "$INSTALLED_JSON")"
          ACTUAL_BUILD="$(jq -r '.[0].build_string' <<< "$INSTALLED_JSON")"
          ACTUAL_CHANNEL="$(jq -r '.[0].channel' <<< "$INSTALLED_JSON")"

          echo "Installed package:"
          echo "  Version: $ACTUAL_VERSION"
          echo "  Build:   $ACTUAL_BUILD"
          echo "  Channel: $ACTUAL_CHANNEL"

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Wrong package version installed."
            exit 1
          fi

          if [[ "$ACTUAL_BUILD" != "$EXPECTED_BUILD" ]]; then
            echo "Wrong package build installed."
            exit 1
          fi

      - name: Show installed environment
        if: ${{ always() }}
        shell: bash -l {0}
        run: |
          conda info
          conda list -n testenv || true

  publish:
    name: Publish ${{ inputs.packageName }} to Anaconda
    needs:
      - build_base
      - test_base

    if: |
      always() &&
      needs.build_base.result == 'success' &&
      (
        needs.test_base.result == 'success' ||
        needs.test_base.result == 'skipped'
      )

    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Download tested Conda packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-${{ inputs.packageName }}-py*
          path: dist
          merge-multiple: true

      - name: Publish packages to Anaconda
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_SECRET }}
        run: |
          set -euo pipefail

          conda install -y -n base -c conda-forge anaconda-client

          mapfile -t PACKAGES < <(
            find dist -type f \
              \( -name "*.conda" -o -name "*.tar.bz2" \) |
            sort
          )

          if [[ "${#PACKAGES[@]}" -eq 0 ]]; then
            echo "No Conda packages were found for publishing."
            exit 1
          fi

          echo "Publishing ${#PACKAGES[@]} package(s):"
          printf ' - %s\n' "${PACKAGES[@]}"

          for PACKAGE_PATH in "${PACKAGES[@]}"; do
            conda run --no-capture-output -n base anaconda \
              -t "$ANACONDA_TOKEN" \
              upload "$PACKAGE_PATH" \
              --label "${{ inputs.label }}"
          done