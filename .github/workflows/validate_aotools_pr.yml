name: Validate AOtools PR

on:
  pull_request:
    branches: [main]
    paths:
      - "aotools/**"
      - ".github/workflows/build_aotools.yml"
      - ".github/workflows/build_base.yml"
      - ".github/workflows/validate_aotools_pr.yml"
      - ".github/scripts/**"
      - ".github/dependency-scan.toml"

permissions:
  contents: read

concurrency:
  group: validate-aotools-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scanner-tests:
    name: Dependency scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner tests
        run: |
          python -m unittest discover \
            -s .github/scripts/tests \
            -p 'test_*.py' \
            -v

  validate-aotools:
    name: Build and test AOtools
    needs: scanner-tests
    uses: ./.github/workflows/build_aotools.yml
    with:
      label: main
      dev: false
      publish: false
      buildNumber: "0"
