name: Build All

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "arm64-test"
        required: true
      dev:
        type: boolean
        default: false
        required: false
      buildNumber:
        type: string
        required: true

jobs:
  dispatch-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Explain branch selection
        run: |
          echo "Select test/arm64-pr71 in Run workflow to run the full build."
          echo "This main-branch entry only makes manual dispatch available."
