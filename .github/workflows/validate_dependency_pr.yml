
name: Validate Dependency PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Dependencies
    runs-on: ubuntu-latest

    outputs:
      dependencies: ${{ steps.detect.outputs.dependencies }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect changed dependencies
        id: detect
        shell: bash
        run: |
          result=$(python .github/scripts/detect_changed_dependencies.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}")

          echo "dependencies=$result" >> "$GITHUB_OUTPUT"
          echo "$result"

  validate-idg:
    name: Validate IDG
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).idg }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_idg.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false

  # Validate tools21cm only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-tools21cm:
    name: Validate tools21cm
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).tools21cm }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_tools21cm.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
