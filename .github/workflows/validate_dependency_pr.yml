
name: Validate Dependency PR

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Dependencies
    runs-on: ubuntu-latest

    outputs:
      dependencies: ${{ steps.detect.outputs.dependencies }}
      head: ${{ steps.pr.outputs.head }}
      aotools_version: ${{ steps.aotools_version.outputs.version }}
      idg_version: ${{ steps.idg_version.outputs.version }}

    steps:
      - name: Resolve PR commits
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1

            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

            base=$(jq -r '.base.sha' <<< "$pr")
            head=$(jq -r '.head.sha' <<< "$pr")
            state=$(jq -r '.state' <<< "$pr")
            base_ref=$(jq -r '.base.ref' <<< "$pr")
            head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")

            [[ "$state" == "open" &&
               "$base_ref" == "main" &&
               "$head_repo" == "$GITHUB_REPOSITORY" ]] || exit 1
          else
            base="$EVENT_BASE"
            head="$EVENT_HEAD"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect changed dependencies
        id: detect
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          result=$(python .github/scripts/detect_changed_dependencies.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA")

          echo "dependencies=$result" >> "$GITHUB_OUTPUT"
          echo "$result"
      - name: Run maintenance unit tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Validate tools21cm release identity
        if: ${{ fromJSON(steps.detect.outputs.dependencies).tools21cm }}
        run: python .github/scripts/tools21cm_release.py

      - name: Resolve IDG version from PR head
        id: idg_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).idg }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^  IDG_VERSION: ([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' .github/workflows/build_base.yml)
          [[ -n "$version" ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate AOtools release identity
        id: aotools_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).aotools }}
        run: python .github/scripts/aotools_release.py


  validate-idg:
    name: Validate IDG
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).idg }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_idg.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.idg_version }}

  # Validate tools21cm only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-tools21cm:
    name: Validate tools21cm
