
name: Validate Dependency PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Dependencies
    runs-on: ubuntu-latest

    outputs:
      dependencies: ${{ steps.detect.outputs.dependencies }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect changed dependencies
        id: detect
        shell: bash
        run: |
          result=$(python .github/scripts/detect_changed_dependencies.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}")

          echo "dependencies=$result" >> "$GITHUB_OUTPUT"
          echo "$result"
      # Run shared maintenance tests before starting expensive Conda builds.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run maintenance unit tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      # Check tools21cm release metadata only when tools21cm is affected.
      - name: Validate tools21cm release identity
        if: ${{ fromJSON(steps.detect.outputs.dependencies).tools21cm }}
        run: python .github/scripts/tools21cm_release.py
      # Check AOtools release metadata only when AOtools is affected.
      - name: Validate AOtools release identity
        if: ${{ fromJSON(steps.detect.outputs.dependencies).aotools }}
        run: python .github/scripts/aotools_release.py

  validate-idg:
    name: Validate IDG
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).idg }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_idg.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false

  # Validate tools21cm only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-tools21cm:
    name: Validate tools21cm
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).tools21cm }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_tools21cm.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false

  # Validate AOtools only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-aotools:
    name: Validate AOtools
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).aotools }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_aotools.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false