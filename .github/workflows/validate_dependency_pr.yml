
name: Validate Dependency PR

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Dependencies
    runs-on: ubuntu-latest

    outputs:
      dependencies: ${{ steps.detect.outputs.dependencies }}
      head: ${{ steps.pr.outputs.head }}
      aotools_version: ${{ steps.aotools_version.outputs.version }}
      idg_version: ${{ steps.idg_version.outputs.version }}
      eidos_version: ${{ steps.eidos_version.outputs.version }}
      tools21cm_version: ${{ steps.tools21cm_version.outputs.version }}
      ska_telmodel_version: ${{ steps.ska_telmodel_version.outputs.version }}
      ska_sdp_datamodels_version: ${{ steps.ska_sdp_datamodels_version.outputs.version }}
      pybdsf_version: ${{ steps.pybdsf_version.outputs.version }}
      everybeam_version: ${{ steps.everybeam_version.outputs.version }}
      wsclean_version: ${{ steps.wsclean_version.outputs.version }}
      oskar_version: ${{ steps.oskar_version.outputs.version }}

    steps:
      - name: Resolve PR commits
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1

            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

            base=$(jq -r '.base.sha' <<< "$pr")
            head=$(jq -r '.head.sha' <<< "$pr")
            state=$(jq -r '.state' <<< "$pr")
            base_ref=$(jq -r '.base.ref' <<< "$pr")
            head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")

            [[ "$state" == "open" &&
               "$base_ref" == "main" &&
               "$head_repo" == "$GITHUB_REPOSITORY" ]] || exit 1
          else
            base="$EVENT_BASE"
            head="$EVENT_HEAD"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect changed dependencies
        id: detect
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          result=$(python .github/scripts/detect_changed_dependencies.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA")

          echo "dependencies=$result" >> "$GITHUB_OUTPUT"
          echo "$result"
      - name: Install maintenance test dependencies
        run: python -m pip install "PyYAML==6.0.3" "packaging"

      - name: Run maintenance unit tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Validate tools21cm release identity
        id: tools21cm_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).tools21cm }}
        run: python .github/scripts/tools21cm_release.py

      - name: Resolve Eidos version from PR head
        id: eidos_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).eidos }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(python3 -c '
          import json
          import re

          with open("eidos/release.json", encoding="utf-8") as f:
              data = json.load(f)

          version = data["version"]

          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid Eidos release version")

          if type(data.get("build_number")) is not int or data["build_number"] < 0:
              raise ValueError("Invalid Eidos build number")
          if not isinstance(data.get("git_rev"), str) or not re.fullmatch(r"[0-9a-f]{40}", data["git_rev"]):
              raise ValueError("Invalid Eidos commit")
          print(version)
          ')

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve IDG version from PR head
        id: idg_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).idg }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(python3 -c '
          import json
          import re

          with open("idg/release.json", encoding="utf-8") as f:
              data = json.load(f)

          version = data["version"]

          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid IDG release version")

          print(version)
          ')

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve SKA_Telmodel version from PR head
        id: ska_telmodel_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies)['ska-telmodel'] }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import json, re
          with open("ska-telmodel/release.json", encoding="utf-8") as f:
              data = json.load(f)
          version = data["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid SKA_Telmodel release version")
          print(version)
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve SKA_SDP_Datamodel version from PR head
        id: ska_sdp_datamodels_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies)['ska-sdp-datamodels'] }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import json, re
          with open("ska-sdp-datamodels/release.json", encoding="utf-8") as f:
              data = json.load(f)
          version = data["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid SKA_SDP_Datamodel release version")
          print(version)
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve PyBDSF version from PR head
        id: pybdsf_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).pybdsf }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import json, re
          with open("pybdsf/release.json", encoding="utf-8") as f:
              data = json.load(f)
          version = data["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid PyBDSF release version")
          print(version)
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve EveryBeam version from PR head
        id: everybeam_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).everybeam }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import json, re
          with open("everybeam/release.json", encoding="utf-8") as f:
              data = json.load(f)
          version = data["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid EveryBeam release version")
          print(version)
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve WSClean version from PR head
        id: wsclean_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).wsclean }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import json, re
          with open("wsclean/release.json", encoding="utf-8") as f:
              data = json.load(f)
          version = data["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.0", version):
              raise ValueError("Invalid WSClean release version")
          print(version)
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve OSKAR/OSKARPY versions from PR head
        id: oskar_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).oskar }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import json, re
          with open("oskar/release.json", encoding="utf-8") as f:
              data = json.load(f)
          version = data["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid OSKAR release version")
          print(version)
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate AOtools release identity
        id: aotools_version
        if: ${{ fromJSON(steps.detect.outputs.dependencies).aotools }}
        run: python .github/scripts/aotools_release.py


  validate-oskar:
    name: Validate OSKAR (AMD64/ARM64)
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).oskar }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_oskar.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.oskar_version }}

  validate-oskarpy:
    name: Validate OSKARPY against local OSKAR (AMD64/ARM64)
    needs: [detect-changes, validate-oskar]
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).oskar }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_oskar_py.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.oskar_version }}
      dependencyArtifact: oskar

  validate-finufft:
    name: Validate FINUFFT (AMD64)
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).fftw || fromJSON(needs.detect-changes.outputs.dependencies).finufft }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_finufft.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}

  validate-idg:
    name: Validate IDG
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).idg }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_idg.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.idg_version }}

  # Validate tools21cm only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-tools21cm:
    name: Validate tools21cm
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).tools21cm }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_tools21cm.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.tools21cm_version }}

  # Validate AOtools only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-aotools:
    name: Validate AOtools
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).aotools }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_aotools.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.aotools_version }}

  # Validate seqfile only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-seqfile:
    name: Validate seqfile
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).seqfile }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_seqfile.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false

  # Validate Eidos only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-eidos:
    name: Validate Eidos
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).eidos }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_eidos.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.eidos_version }}

  # Validate SKA Telmodel only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-ska-telmodel:
    name: Validate SKA Telmodel
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies)['ska-telmodel'] }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_SKA_Telmodel.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.ska_telmodel_version }}

  # Validate PyBDSF only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-pybdsf:
    name: Validate PyBDSF
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).pybdsf }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_PyBDSF.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.pybdsf_version }}

  # Validate EveryBeam only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-everybeam:
    name: Validate EveryBeam
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).everybeam }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_everybeam.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.everybeam_version }}

  # Validate WSClean only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-wsclean:
    name: Validate WSClean
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).wsclean }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_wsclean.yml
    with:
      label: main
      dev: false
      devDeps: "EVERYBEAM_VERSION"
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.wsclean_version }}

  # Validate SKA SDP Datamodels when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-ska-sdp-datamodels:
    name: Validate SKA SDP Datamodels
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies)['ska-sdp-datamodels'] }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_SKA_SDP_Datamodel.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      versionOverride: ${{ needs.detect-changes.outputs.ska_sdp_datamodels_version }}

  # Validate SKA SDP Func Native when its files or shared infrastructure change.
  # PR validation must never publish packages.
  validate-ska-sdp-func:
    name: Validate SKA SDP Func Native
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies)['ska-sdp-func'] }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_SKA_SDP_Func_Native.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}

  # Validate the Python wrapper against local Native artifacts when
  # Native changes, otherwise use the published Native package.
  # PR validation must never publish Conda packages.
  validate-ska-sdp-func-python:
    name: Validate SKA SDP Func Python
    needs: [detect-changes, validate-ska-sdp-func]
    if: >-
      ${{
        !cancelled() &&
        needs.detect-changes.result == 'success' &&
        fromJSON(needs.detect-changes.outputs.dependencies)['ska-sdp-func-python'] &&
        (
          needs.validate-ska-sdp-func.result == 'success' ||
          (
            !fromJSON(needs.detect-changes.outputs.dependencies)['ska-sdp-func'] &&
            needs.validate-ska-sdp-func.result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_SKA_SDP_Func_Python.yml
    with:
      label: main
      dev: false
      devDeps: "SKA_SDP_DTMDL_VERSION, SKA_SDP_FUNC_VERSION"
      buildNumber: "0"
      publish: false
      checkoutRef: ${{ needs.detect-changes.outputs.head }}
      dependencyArtifact: ${{ fromJSON(needs.detect-changes.outputs.dependencies)['ska-sdp-func'] && 'ska-sdp-func' || '' }}

  # Validate ARatmospy when its dependency or shared files change.
  # PR validation must never publish Conda packages.
  validate-aratmospy:
    name: Validate ARatmospy
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).aratmospy }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_ARatmospy.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false

  # Validate PyUVData only when its dependency or shared build files change.
  # PR validation must never publish Conda packages.
  validate-pyuvdata:
    name: Validate PyUVData
    needs: detect-changes
    if: ${{ fromJSON(needs.detect-changes.outputs.dependencies).pyuvdata }}
    permissions:
      contents: read
    uses: ./.github/workflows/build_pyuvdata.yml
    with:
      label: main
      dev: false
      buildNumber: "0"
      publish: false