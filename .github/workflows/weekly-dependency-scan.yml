name: Weekly Feedstock Dependency Scan

on:
  schedule:
    # Monday at 09:00 UTC (11:00 CEST / 10:00 CET in Switzerland).
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the real scan or create a safe notification test issue"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - test-notification

# The scanner can read repository files and manage issues only. It cannot edit
# code, dispatch build workflows, create pull requests, merge, or publish.
permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-feedstock-dependency-scan
  cancel-in-progress: false

jobs:
  scan-feedstock:
    name: Check complete Feedstock
    if: github.repository == 'i4Ds/Karabo-Feedstock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCAN_MODE: ${{ inputs.mode || 'scan' }}

    steps:
      - name: Checkout the reviewed dependency registry
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scanner and complete registry coverage
        run: >-
          python -m unittest discover
          -s .github/scripts/tests
          -p 'test_*.py'
          -v

      - name: Compare Feedstock and upstream stable releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .github/scripts/dependency_scan.py
          --repo-root .
          --config .github/dependency-scan.toml
          --mode "$SCAN_MODE"
