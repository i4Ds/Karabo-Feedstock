
name: Weekly Feedstock Dependency Scan

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/dependency-scan.toml"
      - ".github/workflows/weekly-dependency-scan.yml"
      - ".github/workflows/validate-upgrade-approval.yml"

  schedule:
    # Monday at 09:00 UTC
    - cron: "0 9 * * 1"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run the real scan or create a safe notification test issue"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - test-notification

# Read-only by default, including pull requests.
permissions:
  contents: read

concurrency:
  group: weekly-feedstock-dependency-scan-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Scanner and approval unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all unit tests
        run: |
          python -m unittest discover \
            -s .github/scripts/tests \
            -p 'test_*.py' \
            -v

  scan-feedstock:
    name: Check complete Feedstock
    needs: unit-tests

    if: >-
      github.repository == 'i4Ds/Karabo-Feedstock' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write

    env:
      SCAN_MODE: ${{ inputs.mode || 'scan' }}

    steps:
    - name: Checkout reviewed dependency registry
      uses: actions/checkout@v4
      with:
        persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare Feedstock and upstream stable releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .github/scripts/dependency_scan.py
          --repo-root .
          --config .github/dependency-scan.toml
          --mode "$SCAN_MODE"

      - name: Synchronize review-only upgrade candidates
        if: env.SCAN_MODE == 'scan'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/upgrade_candidates.py
