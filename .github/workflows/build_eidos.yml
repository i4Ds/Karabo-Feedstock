name: Eidos

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "main"
        required: true
      dev:
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish to Anaconda (leave disabled for validation)"
        type: boolean
        required: false
        default: false
      checkoutRef:
        type: string
        required: false
        default: ""
      versionOverride:
        type: string
        required: false
        default: ""
      buildNumber:
        type: string
        required: true

  workflow_call:
    inputs:
      label:
        type: string
        required: true
      dev:
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish to Anaconda (leave disabled for validation)"
        type: boolean
        required: false
        default: false
      checkoutRef:
        type: string
        required: false
        default: ""
      versionOverride:
        type: string
        required: false
        default: ""
      buildNumber:
        type: string
        required: true

jobs:
  eidos:
    uses: ./.github/workflows/build_base.yml
    with:
      packageName: eidos
      packageVersion: $EIDOS_VERSION
      packageVersionName: EIDOS_VERSION
      label: ${{ inputs.label }}
      dev: ${{ inputs.dev }}
      buildNumber: ${{ inputs.buildNumber }}
      pythonCall: import eidos
      publish: ${{ inputs.publish }}
      isNative: false
      checkoutRef: ${{ inputs.checkoutRef }}
      versionOverride: ${{ inputs.versionOverride }}
    secrets: inherit