name: IDG

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "main"
        required: true
      dev:
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: false
      checkoutRef:
        type: string
        required: false
        default: ""
      versionOverride:
        type: string
        required: false
        default: ""

  workflow_call:
    inputs:
      label:
        type: string
        required: true
      dev:
        type: boolean
        required: false
        default: false
      buildNumber:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: false
      checkoutRef:
        type: string
        required: false
        default: ""
      versionOverride:
        type: string
        required: false
        default: ""

jobs:
  resolve-version:
    name: Resolve IDG version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkoutRef || github.sha }}

      - name: Read IDG release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(python3 -c '
          import json
          import re

          with open("idg/release.json", encoding="utf-8") as f:
              data = json.load(f)

          version = data["version"]

          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Invalid IDG release version")

          print(version)
          ')

          echo "version=$version" >> "$GITHUB_OUTPUT"

  IDG:
    name: Build IDG
    needs: resolve-version
    uses: ./.github/workflows/build_base.yml
    with:
      packageName: idg
      packageVersion: $IDG_VERSION
      packageVersionName: IDG_VERSION
      label: ${{ inputs.label }}
      dev: ${{ inputs.dev }}
      buildNumber: ${{ inputs.buildNumber }}
      publish: ${{ inputs.publish }}
      checkoutRef: ${{ inputs.checkoutRef }}
      versionOverride: ${{ inputs.versionOverride || needs.resolve-version.outputs.version }}
      useCuda: true
      isNative: true
    secrets: inherit
