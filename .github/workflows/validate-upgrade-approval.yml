
name: Validate dependency upgrade approval

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-upgrade-approval-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'i4Ds/Karabo-Feedstock' &&
      github.event.label.name == 'upgrade:approved' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify upgrade candidate and approving actor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/approve_dependency_upgrade.py
