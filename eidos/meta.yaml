{% set release = load_file_data("release.json", from_recipe_dir=True) %}

package:
  name: {{ PACKAGE_NAME|lower }}
  version: {{ EIDOS_VERSION_ALT }}

source:
  git_url: https://github.com/i4Ds/eidos.git
  git_rev: {{ release["git_rev"] }}

build:
  number: {{ build }}
  noarch: python

requirements:
  build:
    - python
    - numpy

  host:
    - python
    - pip
    - numpy

  run:
    - python                  >=3.10
    - {{ pin_compatible('numpy') }}
    - scipy                   >=1.13.0 # numpy 2.x compatibility
    - astropy
    - future

about:
  home: https://github.com/ratt-ru/eidos
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: 'edios - Primary beam modelling of radio astronomy antennas.'
  description: |
    Primary beam modelling of radio astronomy antennas.
  doc_url: https://github.com/i4Ds/eidos.git
  dev_url: https://github.com/i4Ds/eidos.git

extra:
  recipe-maintainers:
    - delberin.ali@fhnw.ch
