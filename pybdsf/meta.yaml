package:
  name: {{ PACKAGE_NAME|lower }}
  version: {{ PYBDSF_VERSION_ALT }}

source:
  url: https://pypi.io/packages/source/b/{{ PACKAGE_NAME }}/{{ PACKAGE_NAME }}-{{ PYBDSF_VERSION }}.tar.gz

build:
  number: {{ build }}
  string: py{{ py }}h{{ PKG_HASH }}_{{ build }}

#libboost-python-devel (host): needed at build time so CMake can find Boost.Python headers and config files and link the C++ extension.
#libboost-python (run): needed at runtime because the compiled Python module is dynamically linked against libboost_python*.so.
# Without them: build fails (CMake can’t find Boost.Python), or runtime fails (missing shared library).
requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('gfortran') }}
    - cmake         >=3.18, <4
    - python        {{ python }}
    - numpy         {{ numpy }}
    - libboost-devel        ={{ BOOST_VERSION }}
    - setuptools    <60.0     # [py<312]
    - setuptools    >=61.0    # [py>=312]
    - ninja


  host:
    - python        {{ python }}
    - cmake         >=3.18, <4
    - ninja
    - pip
    - numpy         {{ numpy }}
    - setuptools    <60.0     # [py<312]
    - setuptools    >=61.0    # [py>=312]
    - scikit-build  >=0.13
    - libboost-devel        ={{ BOOST_VERSION }}
    - libboost-python-devel ={{ BOOST_VERSION }}  
    - wheel

  run:
    - python        {{ python }}
    - libboost              ={{ BOOST_VERSION }}
    - libboost-python       ={{ BOOST_VERSION }}
    - astropy
    - {{ pin_compatible('numpy') }}
    - matplotlib-base
    - scipy         >=1.15
    - ipython


about:
  home: "https://github.com/lofar-astron/PyBDSF"
  license: GPL-3.0
  license_family: GPL3
  license_file: LICENSE
  summary: "Blob Detection and Source Finder"
  doc_url: https://www.astron.nl/citt/pybdsf/
  dev_url: https://github.com/lofar-astron/PyBDSF

extra:
  recipe-maintainers:
    - lukas.gehrig@fhnw.ch