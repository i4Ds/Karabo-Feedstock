{% set pName = environ.get("PACKAGE_NAME")|lower %}
{% set release = load_file_data("release.json") %}
{% set fileName = release["wheel"]["filename"] %}

package:
  name: {{ pName }}
  version: {{ FINUFFT_VERSION_ALT }}

source:
  url: "{{ release['wheel']['url'] }}"
  sha256: "{{ release['wheel']['sha256'] }}"
  fn: "{{ fileName }}"

build:
  script_env:
    - FILE_NAME={{ fileName }}
    - FINUFFT_VERSION_ENV={{ FINUFFT_VERSION }}
  number: {{ build }}
  string: py{{ py }}h{{ PKG_HASH }}_{{ build }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('gfortran') }}
    - python
    - make
    - cmake
    - numpy
    - fftw            =={{ FFTW3_VERSION_ALT }}
    
  host:
    - python          {{ python }}
    - pip
    - numpy
    - fftw            =={{ FFTW3_VERSION_ALT }}

  run:
    - python          {{ python }}
    - {{ pin_compatible('numpy', max_pin='x') }}
    - fftw            =={{ FFTW3_VERSION_ALT }}

about:
  home: https://github.com/flatironinstitute/finufft
  license: MIT License or MIT
  license_family: MIT
  summary: 'Nonuniform Fast Fourier Transform library'
  description: |
   Flatiron Institute Nonuniform Fast Fourier Transform library: FINUFFT
  doc_url: https://finufft.readthedocs.io/
  dev_url: https://github.com/flatironinstitute/finufft

extra:
  recipe-maintainers:
    - delberin.ali@fhnw.ch
