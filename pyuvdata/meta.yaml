package:
  name: {{ PACKAGE_NAME|lower }}
  version: {{ PYUVDATA_VERSION_ALT }}

# Karabo pins pyuvdata >=2.4,<3. conda-forge only ever built the 2.4.x series for
# linux-64 / osx, and builds new versions only, so no 2.x package will ever exist for
# linux-aarch64 there. This recipe (adapted from conda-forge/pyuvdata-feedstock at
# d59e280, v2.4.5) provides it on the i4ds channel for every arch CI builds.
source:
  url: https://files.pythonhosted.org/packages/source/p/pyuvdata/pyuvdata-{{ PYUVDATA_VERSION }}.tar.gz
  sha256: 31934f3611557d25e010b123c26d4ce1a8a9c1145df1e8d5adcebab3409ca6f1  # 2.4.5

build:
  number: {{ build }}
  string: py{{ py }}h{{ PKG_HASH }}_{{ build }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

  host:
    - python                {{ python }}
    - pip
    - setuptools            >=61
    - setuptools_scm        <7.0|>=7.0.3
    - cython                >=3.0,<3.1  # >=3.1 dropped numpy.long from its bundled numpy pxd (used in corr_fits.pyx)
    - numpy
    - astropy               >=6.0
    - docstring_parser      >=0.15
    - h5py                  >=3.4
    - pyerfa                >=2.0.1.1
    - scipy                 >=1.7.3

  run:
    - python                {{ python }}
    - {{ pin_compatible('numpy') }}
    - astropy               >=6.0
    - docstring_parser      >=0.15
    - h5py                  >=3.4
    - pyerfa                >=2.0.1.1
    - scipy                 >=1.7.3
    - setuptools_scm        <7.0|>=7.0.3

test:
  imports:
    - pyuvdata
  commands:
    - python -c "from pyuvdata import UVData; from pyuvdata.uvdata import ms"

about:
  home: https://github.com/RadioAstronomySoftwareGroup/pyuvdata
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'an interface for astronomical interferometeric datasets in python'
  doc_url: https://pyuvdata.readthedocs.io
  dev_url: https://github.com/RadioAstronomySoftwareGroup/pyuvdata

extra:
  recipe-maintainers:
    - delberin.ali@fhnw.ch
